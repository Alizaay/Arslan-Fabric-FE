<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signed Out | Arsalan Fabrics</title>
  <link rel="stylesheet" href="css/customer-profile-dashboard.css">
  <link rel="stylesheet" href="css/shared-overlays.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header><div id="header-container"></div></header>
  <main class="signed-out-page">
    <section class="signed-out-card">
      <h1>You're signed out.</h1>
      <p>Thank you for visiting Arsalan Fabrics. We look forward to welcoming you back soon.</p>
      <p class="signed-out-note">Your shopping bag is saved for your next visit.</p>
      <a class="af-btn" href="#" data-open-signin>Sign In Again</a>
      <a class="af-btn-outline" href="index.html">Continue Shopping</a>
    </section>
  </main>
  <footer><div id="footer-container"></div></footer>
  <script src="js/config.js"></script>
    <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/include.js"></script>
  <script>document.querySelector('[data-open-signin]')?.addEventListener('click', (e)=>{e.preventDefault();ArsalanAuth.openModal('signin');});</script>
  <style>
    .signed-out-page{display:flex;justify-content:center;padding:80px 20px;}
    .signed-out-card{max-width:520px;width:100%;background:#fff;border:1px solid #eae6df;border-radius:12px;padding:40px;text-align:center;}
    .signed-out-note{background:#f5efe0;padding:12px;border-radius:6px;margin:20px 0;}
    .af-btn-outline{display:inline-block;margin-top:12px;padding:12px 18px;border:1px solid #1f1e1c;color:#1f1e1c;text-decoration:none;border-radius:6px;}
  </style>
</body>
</html>
