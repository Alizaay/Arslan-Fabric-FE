<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | Profile Settings</title>
    <link rel="stylesheet" href="css/profile-setting.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/shared-overlays.css">
</head>

<body>
    <header>
        <div id="header-container"></div>
    </header>

    <main>

        <!-- Dashboard Section -->

        <section class="account-page">
            <div class="account-container">
                <aside class="account-sidebar">
                    <nav class="account-nav">
                        <a href="#" class="account-nav-item">
                            Dashboard
                        </a>
                        <a href="#" class="account-nav-item active">
                            Profile Settings
                        </a>
                        <a href="#" class="account-nav-item">
                            Delivery Addresses
                        </a>
                        <a href="#" class="account-nav-item">
                            Order History
                        </a>
                        <a href="#" class="account-nav-item">
                            Wishlist
                        </a>
                        <a href="#" class="account-nav-item">
                            Atelier Support
                        </a>
                    </nav>
                </aside>
                <main class="account-main">
                    <div class="welcome-card">
                        <div class="welcome-content">
                            <span class="welcome-label">
                                WELCOME BACK
                            </span>
                            <h1>
                                Ayesha Khan
                            </h1>
                        </div>
                        <div class="store-credit">
                            <span>STORE CREDIT</span>
                            <strong>Rs. 0</strong>
                        </div>
                    </div>
                    <div class="account-grid">
                        <section class="profile-card">
                            <h2>Personal Profile</h2>
                            <form class="profile-form">
                                <div class="form-group">
                                    <label for="full-name">
                                        FULL NAME *
                                    </label>
                                    <input type="text" id="full-name" value="Ayesha Khan">
                                </div>
                                <div class="form-group">
                                    <label for="email">
                                        EMAIL ADDRESS *
                                    </label>
                                    <input type="email" id="email" value="customer@email.com">
                                    <span class="verified">
                                        ✓ Verified Email
                                    </span>
                                </div>
                                <div class="form-group">
                                    <label for="phone">
                                        PHONE NUMBER (FOR SHIPMENT UPDATES) *
                                    </label>
                                    <input type="tel" id="phone" value="0300-1234567">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="birthday">
                                            BIRTHDAY (OPTIONAL)
                                        </label>
                                        <input type="date" id="birthday" placeholder="DD / MM / YYYY">
                                    </div>
                                    <div class="form-group">
                                        <label for="gender">
                                            GENDER (OPTIONAL)
                                        </label>
                                        <select id="gender">
                                            <option value="">
                                                Select Gender
                                            </option>
                                            <option>
                                                Male
                                            </option>
                                            <option>
                                                Female
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="save-button">
                                    SAVE CHANGES
                                </button>
                            </form>
                        </section>
                        <section class="security-card">
                            <h2>
                                Preferences &amp; Security
                            </h2>
                            <div class="preference-list">
                                <div class="preference-item">
                                    <span>
                                        Email newsletters &amp; collection previews
                                    </span>
                                    <label class="switch">
                                        <input type="checkbox" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                                <div class="preference-item">
                                    <span>
                                        SMS order tracking &amp; hub notifications
                                    </span>
                                    <label class="switch">
                                        <input type="checkbox" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="security-actions">
                                <button class="change-password">
                                    CHANGE PASSWORD
                                </button>
                                <button class="delete-account">
                                    DELETE ACCOUNT
                                </button>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        </section>
    </main>

    <footer>
        <div id="footer-container"></div>
    </footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/include.js"></script>
</body>

</html>
