<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Support | Arsalan Fabrics</title>
  <link rel="stylesheet" href="css/customer-profile-dashboard.css">
  <link rel="stylesheet" href="css/shared-overlays.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header><div id="header-container"></div></header>
  <main class="account-layout">
    <aside class="account-sidebar">
      <a href="customer-profile-dashboard.html">Dashboard</a>
      <a href="profile-setting.html">Profile Settings</a>
      <a href="delivery-addresses.html">Delivery Addresses</a>
      <a href="order-history.html">Order History</a>
      <a href="my-wishlist.html">Wishlist</a>
      <a class="active" href="atelier-support.html">Atelier Support</a>
    </aside>
    <section class="account-content">
      <h1>Atelier Support</h1>
      <p>How can we help you today?</p>
      <form id="support-form" class="support-form">
        <label>Topic<input name="topic" required></label>
        <label>Order Number (optional)<input name="orderNumber"></label>
        <label>Subject<input name="subject" required></label>
        <label>Message<textarea name="message" rows="5" required></textarea></label>
        <button class="af-btn" type="submit">Submit Support Ticket</button>
      </form>
      <div id="ticket-list"></div>
    </section>
  </main>
  <footer><div id="footer-container"></div></footer>
  <script src="js/config.js"></script>
    <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/include.js"></script>
  <script>
    const user = ArsalanAuth.user();
    if (!user) location.href = 'index.html';
    document.getElementById('support-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await fetch('/api/support/tickets', { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${localStorage.getItem('af_token')}`}, body: JSON.stringify(Object.fromEntries(fd)) });
      alert('Ticket submitted');
      loadTickets();
    });
    async function loadTickets() {
      const tickets = await fetch('/api/support/tickets', { headers:{ Authorization:`Bearer ${localStorage.getItem('af_token')}` } }).then(r=>r.json());
      document.getElementById('ticket-list').innerHTML = tickets.map(t=>`<p>${t.ticketNumber} · ${t.subject} · ${t.status}</p>`).join('');
    }
    loadTickets();
  </script>
  <style>.support-form{display:grid;gap:12px;max-width:720px}.support-form input,.support-form textarea{width:100%;padding:10px;border:1px solid #eae6df;border-radius:6px}</style>
</body>
</html>
