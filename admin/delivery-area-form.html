<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <base href="/admin/">

  <title>Add Delivery Area | Atelier Portal</title>

  <link rel="stylesheet" href="css/admin.css">

</head>

<body class="admin-app">

  <div class="admin-layout">

    <aside class="admin-sidebar" data-admin-sidebar>

      <div class="admin-sidebar-brand">

        <h1 class="admin-brand">Arsalan Fabrics</h1>

        <small>ATELIER PORTAL</small>

      </div>

      <nav data-admin-nav></nav>

      <div class="admin-sidebar-foot">

        <a class="admin-store-link" href="../index.html" target="_blank" rel="noopener">View storefront</a>

        <button class="dashboard-btn light-btn btn-logout" type="button" data-admin-logout>Log out</button>

      </div>

    </aside>

    <div class="admin-main">

      <header class="admin-topbar">

        <h1 id="page-title">Add delivery area</h1>

      </header>

      <main class="admin-content">

        <section class="af-card admin-settings-card">

          <p class="admin-settings-lead">

            <a href="delivery-areas.html">← Back to delivery areas</a>

          </p>

          <form id="area-form" class="admin-form">

            <label class="admin-field">

              <span class="af-label">Area / city</span>

              <input name="city" type="text" required>

            </label>

            <label class="admin-field">

              <span class="af-label">Delivery charge (Rs.)</span>

              <input name="charge" type="number" min="0" step="1" required>

            </label>

            <label class="admin-field">

              <span class="af-label">Estimated delivery time</span>

              <input name="estimatedTime" type="text" placeholder="2–3 business days">

            </label>

            <label class="admin-field admin-field--checkbox">

              <input type="checkbox" name="isActive" checked>

              <span>Active</span>

            </label>

            <div class="admin-form-actions">

              <button class="btn" type="submit">Save delivery area</button>

            </div>

          </form>

        </section>

      </main>

    </div>

  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>

  <script src="js/api.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/sidebar.js"></script>

  <script>

    AdminAuth.require();

    AdminSidebar.render('delivery-area-form.html');

    const areaForm = document.getElementById('area-form');

    const id = new URLSearchParams(location.search).get('id');

    if (id) {

      document.getElementById('page-title').textContent = 'Edit delivery area';

      AdminAPI.request('/delivery/areas').then((areas) => {

        const a = areas.find((x) => x._id === id);

        if (!a) return;

        areaForm.elements.city.value = a.city;

        areaForm.elements.charge.value = a.charge;

        areaForm.elements.estimatedTime.value = a.estimatedTime || '';

        areaForm.elements.isActive.checked = a.isActive;

      });

    }

    areaForm.addEventListener('submit', async (e) => {

      e.preventDefault();

      const fd = new FormData(areaForm);

      const body = {

        city: fd.get('city'),

        charge: Number(fd.get('charge')),

        estimatedTime: fd.get('estimatedTime'),

        isActive: fd.get('isActive') === 'on',

      };

      if (id) await AdminAPI.request(`/delivery/areas/${id}`, { method: 'PUT', body: JSON.stringify(body) });

      else await AdminAPI.request('/delivery/areas', { method: 'POST', body: JSON.stringify(body) });

      window.location.href = 'delivery-areas.html';

    });

  </script>

</body>

</html>
