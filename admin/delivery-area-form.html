<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Delivery Area | Atelier Portal</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-admin-sidebar><div><h1 class="admin-brand">Arsalan Fabrics</h1><small>ATELIER PORTAL</small></div><nav data-admin-nav></nav><button class="btn-outline" type="button" data-admin-logout>Logout</button></aside>
    <div class="admin-main">
      <header class="admin-topbar"><button type="button" class="btn-outline admin-menu-btn" data-admin-menu-toggle>Menu</button><h1>Add Delivery Area</h1></header>
      <main class="admin-content panel">
        <form id="area-form" class="login-card" style="width:100%;max-width:640px;">
          <label>Area / City<input name="city" required></label>
          <label>Delivery Charge (Rs.)<input name="charge" type="number" required></label>
          <label>Estimated Delivery Time<input name="estimatedTime" placeholder="2–3 business days"></label>
          <label><input type="checkbox" name="isActive" checked> Active</label>
          <button class="btn" type="submit">Save Delivery Area</button>
        </form>
      </main>
    </div>
  </div>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/sidebar.js"></script>
  <script>
    AdminAuth.require();
    AdminSidebar.render('delivery-charges.html');
    const id = new URLSearchParams(location.search).get('id');
    if (id) {
      AdminAPI.request('/delivery/areas').then((areas) => {
        const a = areas.find((x) => x._id === id);
        if (!a) return;
        area-form.city.value = a.city;
        area-form.charge.value = a.charge;
        area-form.estimatedTime.value = a.estimatedTime || '';
        area-form.isActive.checked = a.isActive;
      });
    }
    area-form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(area-form);
      const body = {
        city: fd.get('city'),
        charge: Number(fd.get('charge')),
        estimatedTime: fd.get('estimatedTime'),
        isActive: fd.get('isActive') === 'on',
      };
      if (id) await AdminAPI.request(`/delivery/areas/${id}`, { method: 'PUT', body: JSON.stringify(body) });
      else await AdminAPI.request('/delivery/areas', { method: 'POST', body: JSON.stringify(body) });
      location.href = 'delivery-areas.html';
    });
  </script>
</body>
</html>
