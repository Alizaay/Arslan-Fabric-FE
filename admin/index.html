<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Atelier Portal</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div>
        <h1 class="admin-brand">Arsalan Fabrics</h1>
        <small>ATELIER PORTAL</small>
      </div>
      <nav data-admin-nav></nav>
      <button class="btn-outline" type="button" data-admin-logout>Logout</button>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar"><h1>Store Overview</h1><div>Arsalan Admin</div></header>
      <main class="admin-content">
        <h2>Hi, Arsalan</h2>
        <p>Welcome back. Here’s what’s happening with your store today.</p>
        <section class="card-grid" id="stats-grid"></section>
        <section class="panel" style="margin-top:24px;">
          <h3>New Orders Received</h3>
          <table><thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody id="orders-body"></tbody></table>
        </section>
      </main>
    </div>
  </div>
  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    AdminAuth.require();
    AdminSidebar.render('index.html');
    Promise.all([AdminAPI.request('/stats'), AdminAPI.request('/orders?status=new')]).then(([stats, orders]) => {
      document.getElementById('stats-grid').innerHTML = `
        <article class="stat-card"><h3>Total Products</h3><p>${stats.products}</p></article>
        <article class="stat-card"><h3>Total Orders</h3><p>${stats.orders}</p></article>
        <article class="stat-card"><h3>New Orders</h3><p>${stats.newOrders}</p></article>
        <article class="stat-card"><h3>Total Sales</h3><p>Rs. ${stats.sales.toLocaleString()}</p></article>`;
      document.getElementById('orders-body').innerHTML = orders.slice(0, 5).map(o => `
        <tr><td>${o.orderNumber}</td><td>${o.customerName || '-'}</td><td>Rs. ${o.total?.toLocaleString()}</td><td><span class="badge badge-new">${o.status}</span></td></tr>`).join('');
    });
  </script>
</body>
</html>
