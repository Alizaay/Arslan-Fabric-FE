<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/admin/">
  <title>Admin Login | Arsalan Fabrics</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-page">
    <section class="login-brand" aria-hidden="false">
      <div class="login-brand-inner">
        <p class="login-portal-tag">Atelier Portal</p>
        <h1 class="login-brand-title">Arsalan Fabrics</h1>
        <p class="login-brand-tagline">Manage products, orders, and your storefront from one place.</p>
      </div>
      <p class="login-brand-foot">Need help? <a href="mailto:support@arsalanfabrics.com">support@arsalanfabrics.com</a></p>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <header class="login-card-head">
          <h2>Welcome back</h2>
          <p>Sign in to the Atelier Portal.</p>
        </header>
        <p class="error" id="login-error" hidden role="alert"></p>
        <form id="login-form" class="login-form">
          <label class="login-field">
            <span class="login-label">Email address</span>
            <input type="email" name="email" autocomplete="username" placeholder="admin@arsalanfabrics.com" required>
          </label>
          <label class="login-field">
            <span class="login-label">Password</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
          </label>
          <button class="btn btn-login" type="submit">Sign in</button>
        </form>
        <footer class="login-card-foot">
          <a class="login-back" href="../index.html">← Back to store</a>
        </footer>
      </div>
    </section>
  </div>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = document.getElementById('login-error');
      errEl.hidden = true;
      try {
        const data = await AdminAPI.authLogin(fd.get('email'), fd.get('password'));
        if (data.user.role !== 'admin') throw new Error('Email or password is incorrect.');
        AdminAuth.save(data.token, data.user);
        window.location.href = 'index.html';
      } catch (err) {
        errEl.hidden = false;
        errEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
