<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Arsalan Fabrics</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <section class="login-brand">
      <div>
        <h1 class="admin-brand">Arsalan Fabrics</h1>
        <small>ATELIER PORTAL</small>
        <p>Manage your store with confidence.</p>
      </div>
      <p>support@arsalanfabrics.com</p>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <h2>Welcome back</h2>
        <p>Sign in to manage Arsalan Fabrics.</p>
        <p class="error" id="login-error" hidden></p>
        <form id="login-form">
          <label>Email address<input type="email" name="email" value="admin@arsalanfabrics.com" required></label>
          <label>Password<input type="password" name="password" required></label>
          <button class="btn" type="submit">Sign In</button>
        </form>
        <p><a href="../index.html">Back to Store</a></p>
      </div>
    </section>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const data = await AdminAPI.authLogin(fd.get('email'), fd.get('password'));
        if (data.user.role !== 'admin') throw new Error('Email or password is incorrect.');
        AdminAuth.save(data.token, data.user);
        window.location.href = 'index.html';
      } catch (err) {
        const el = document.getElementById('login-error');
        el.hidden = false;
        el.textContent = err.message;
      }
    });
  </script>
</body>
</html>
