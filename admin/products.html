<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Atelier Portal</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"><div><h1 class="admin-brand">Arsalan Fabrics</h1><small>ATELIER PORTAL</small></div><nav data-admin-nav></nav><button class="btn-outline" type="button" data-admin-logout>Logout</button></aside>
    <div class="admin-main">
      <header class="admin-topbar"><h1>Products Catalog</h1><a class="btn" href="product-form.html">+ Add Product</a></header>
      <main class="admin-content panel">
        <table><thead><tr><th>Product</th><th>Code</th><th>Price</th><th>Stock</th><th>Website</th><th></th></tr></thead><tbody id="products-body"></tbody></table>
      </main>
    </div>
  </div>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/sidebar.js"></script>
  <script>
    AdminAuth.require(); AdminSidebar.render('products.html');
    AdminAPI.request('/products').then((products) => {
      document.getElementById('products-body').innerHTML = products.map(p => `
        <tr>
          <td>${p.name}</td><td>${p.articleCode}</td><td>Rs. ${p.price?.toLocaleString()}</td><td>${p.stock}</td>
          <td>${p.showOnWebsite ? 'SHOWING' : 'HIDDEN'}</td>
          <td><a href="product-form.html?id=${p._id}">Edit</a></td>
        </tr>`).join('');
    });
  </script>
</body>
</html>
