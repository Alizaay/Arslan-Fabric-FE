<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/admin/">
  <title>Customers | Atelier Portal</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"><div><h1 class="admin-brand">Arsalan Fabrics</h1><small>ATELIER PORTAL</small></div><nav data-admin-nav></nav><button class="btn-outline" type="button" data-admin-logout>Logout</button></aside>
    <div class="admin-main"><header class="admin-topbar"><h1>Customers Directory</h1></header><main class="admin-content panel"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody id="cust-body"></tbody></table></main></div>
  </div>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/sidebar.js"></script>
  <script>
    AdminAuth.require();
    AdminSidebar.render('customers.html');
    AdminAPI.request('/customers')
      .then((c) => {
        document.getElementById('cust-body').innerHTML = c.length
          ? c.map((x) => `<tr><td>${x.name}</td><td>${x.email}</td><td>${x.status || 'active'}</td><td><a href="customer-profile.html?id=${x._id}">View</a></td></tr>`).join('')
          : '<tr><td colspan="4" class="table-empty">No customers yet.</td></tr>';
      })
      .catch(() => {
        document.getElementById('cust-body').innerHTML =
          '<tr><td colspan="4" class="table-empty">Could not load customers.</td></tr>';
      });
  </script>
</body></html>
