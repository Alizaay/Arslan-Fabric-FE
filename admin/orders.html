<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Atelier Portal</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-admin-sidebar><div><h1 class="admin-brand">Arsalan Fabrics</h1><small>ATELIER PORTAL</small></div><nav data-admin-nav></nav><button class="btn-outline" type="button" data-admin-logout>Logout</button></aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="btn-outline admin-menu-btn" data-admin-menu-toggle>Menu</button>
        <h1>Customer Orders</h1>
      </header>
      <main class="admin-content panel">
        <div class="order-tabs" id="order-tabs">
          <button type="button" data-status="all" class="active">All <span data-count="all"></span></button>
          <button type="button" data-status="new">New <span data-count="new"></span></button>
          <button type="button" data-status="processing">Processing <span data-count="processing"></span></button>
          <button type="button" data-status="shipped">Shipped <span data-count="shipped"></span></button>
          <button type="button" data-status="delivered">Delivered <span data-count="delivered"></span></button>
        </div>
        <table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody id="orders-body"></tbody></table>
      </main>
    </div>
  </div>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/sidebar.js"></script>
  <script>
    AdminAuth.require(); AdminSidebar.render('orders.html');
    let status = 'all';
    const counts = { all: 0, new: 0, processing: 0, shipped: 0, delivered: 0 };

    function badge(s) {
      return `<span class="badge-status">${s}</span>`;
    }

    async function loadCounts() {
      const all = await AdminAPI.request('/orders?status=all');
      counts.all = all.length;
      ['new', 'processing', 'shipped', 'delivered'].forEach(async (st) => {
        const list = await AdminAPI.request(`/orders?status=${st}`);
        counts[st] = list.length;
        const el = document.querySelector(`[data-count="${st}"]`);
        if (el) el.textContent = list.length ? `(${list.length})` : '';
      });
      const allEl = document.querySelector('[data-count="all"]');
      if (allEl) allEl.textContent = counts.all ? `(${counts.all})` : '';
    }

    const load = () => AdminAPI.request(`/orders?status=${status}`).then((orders) => {
      document.getElementById('orders-body').innerHTML = orders.map(o => `
        <tr>
          <td>${o.orderNumber}</td>
          <td>${o.customerName}<br><small>${o.customerEmail || ''}</small></td>
          <td>Rs. ${o.total?.toLocaleString()}</td>
          <td>${(o.paymentMethod || '').toUpperCase()}</td>
          <td>${badge(o.status)}</td>
          <td><a href="order-detail.html?id=${o._id}">View</a></td>
        </tr>`).join('') || '<tr><td colspan="6">No orders in this tab.</td></tr>';
    });

    document.querySelectorAll('#order-tabs [data-status]').forEach(btn => btn.addEventListener('click', () => {
      status = btn.dataset.status;
      document.querySelectorAll('#order-tabs button').forEach(b => b.classList.toggle('active', b === btn));
      load();
    }));

    loadCounts();
    load();
  </script>
</body>
</html>
