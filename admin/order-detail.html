<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail | Atelier Portal</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"><div><h1 class="admin-brand">Arsalan Fabrics</h1><small>ATELIER PORTAL</small></div><nav data-admin-nav></nav><button class="btn-outline" type="button" data-admin-logout>Logout</button></aside>
    <div class="admin-main">
      <header class="admin-topbar"><h1 id="order-title">Order Detail</h1></header>
      <main class="admin-content panel" id="order-panel"></main>
    </div>
  </div>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/sidebar.js"></script>
  <script>
    AdminAuth.require(); AdminSidebar.render('orders.html');
    const id = new URLSearchParams(location.search).get('id');
    AdminAPI.request(`/orders/${id}`).then((o) => {
      document.getElementById('order-title').textContent = o.orderNumber;
      document.getElementById('order-panel').innerHTML = `
        <p>Customer: ${o.customerName} · ${o.customerEmail}</p>
        <p>Total: Rs. ${o.total?.toLocaleString()} · Status: ${o.status}</p>
        <label>Tracking ID<input id="trackingId" value="${o.trackingId || ''}"></label>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-outline" data-action="processing">Mark Processing</button>
          <button class="btn-outline" data-action="shipped">Mark Shipped</button>
          <button class="btn" data-action="delivered">Mark Delivered</button>
        </div>`;
      document.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', async () => {
        await AdminAPI.request(`/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status: btn.dataset.action, trackingId: document.getElementById('trackingId').value, courier: 'Leopards Courier' }) });
        location.reload();
      }));
    });
  </script>
</body>
</html>
